{% extends 'base.html' %}{% block content %}<section class="title"><div><h1>Strategy: {{player.name}}</h1><p>{{player.player_code}} · {{player.role}}</p></div></section><form class="panel form narrow" method="post"><label>Priority<select name="priority"><option {% if fav and fav.priority=='High' %}selected{% endif %}>High</option><option {% if not fav or fav.priority=='Medium' %}selected{% endif %}>Medium</option><option {% if fav and fav.priority=='Low' %}selected{% endif %}>Low</option></select></label><label>Expected price<input name="expected_price" type="number" value="{{fav.expected_price if fav and fav.expected_price else ''}}"></label><label>Maximum price<input name="maximum_price" type="number" value="{{fav.maximum_price if fav and fav.maximum_price else ''}}"></label><label>Personal notes<textarea name="notes">{{fav.notes if fav else ''}}</textarea></label><button>Save strategy</button></form>{% endblock %}
