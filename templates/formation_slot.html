<form class="formation-slot {{slot.slot_type|lower}}" method="post"><input type="hidden" name="action" value="assign"><input type="hidden" name="slot_code" value="{{slot.slot_code}}"><div class="slot-label"><span class="player-icon {% if slot.slot_type=='GK' %}gk{% endif %}">{% if slot.slot_type=='GK' %}&#129958;{% else %}&#9917;{% endif %}</span><span>{{slot.label}}</span></div><select name="player_ref" onchange="this.form.submit()"><option value="">Empty slot</option>{% for player in candidates %}<option value="{{player.ref}}" {% if player.ref==slot.selected_ref %}selected{% endif %}>{{player.name}} ({{player.role}})</option>{% endfor %}</select>{% if slot.selected %}<b>{{slot.selected.name}}</b><small>{{slot.selected.kind}} - {{slot.selected.role}}</small>{% else %}<b>Unassigned</b><small>Choose a player</small>{% endif %}</form>
